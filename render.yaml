services:
  - type: web
    name: lintel
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # Free plan: no persistent disk, so SQLite resets on each deploy or spin-down.
    # For persistence switch to plan: starter and add:
    #   disk: { name: lintel-data, mountPath: /var/data, sizeGB: 1 }  and DB_PATH=/var/data/lintel.db
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BROWSER_PROVIDER
        value: kernel
      - key: DB_PATH
        value: ./data/lintel.db
      - key: APPROVAL_TIMEOUT_MS
        value: "900000"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: LINTEL_SECRET
        generateValue: true
